<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>旅行规划 Agent · 内测 v1.2</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>旅行规划 Agent · 内测 v1.2</h1>
    <p>多国家/多城市层级输入 + 可选酒店锚点；支持策略引擎、跨城公共交通分段与酒店闭环硬约束。</p>
  </header>

  <main id="mainLayout" class="layout mode-input-focus">
    <section class="panel controls">
      <h2>参数设置</h2>

      <label>
        Google Maps API Key
        <input id="apiKeyInput" type="password" placeholder="粘贴你的 API Key" />
      </label>
      <button id="connectMapBtn" type="button">连接 Google 地图</button>

      <h3>行程目的地与点位</h3>
      <p class="tips">每行可选择“景点/酒店”，默认是景点；若选酒店，将作为可选酒店锚点使用。</p>
      <div id="destinationsRoot" class="destinations-root"></div>
      <button id="addCountryBtn" type="button" class="btn-secondary">+ 添加国家/地区</button>
      <button id="markMapBtn" type="button">在地图上标点</button>

      <p id="statusText" class="status">请填写层级目的地与景点，连接地图后点击「在地图上标点」。</p>

      <h3>已解析点位</h3>
      <div id="placesList" class="places-list"></div>

      <h3>LLM 配置（智能规划必需）</h3>
      <label>
        LLM Base URL（OpenAI兼容）
        <input id="llmBaseUrlInput" type="text" value="https://dashscope.aliyuncs.com/compatible-mode/v1" />
      </label>
      <label>
        LLM API Key
        <input id="llmApiKeyInput" type="password" placeholder="粘贴通义千问 DashScope API Key" />
      </label>
      <label>
        已识别供应商
        <input id="llmProviderInput" type="text" value="qwen" readonly />
      </label>
      <label>
        LLM Model（自动识别下拉）
        <select id="llmModelSelect"></select>
      </label>
      <div class="destination-row">
        <label>
          游玩天数
          <input id="daysInput" type="number" min="1" max="15" value="2" />
        </label>
        <label>
          默认停留时长（分钟）
          <input id="visitMinutesInput" type="number" min="30" max="240" value="90" />
        </label>
      </div>
      <label>
        规划策略
        <select id="strategySelect">
          <option value="fastest" selected>省时优先（总通勤最短）</option>
          <option value="least-transfer">少换乘优先（减少跨城）</option>
          <option value="classic">经典打卡优先（不走回头路 + 高优先级）</option>
        </select>
      </label>
      <button id="llmAnalyzeBtn" type="button">先用 LLM 分析景点时长</button>
      <button id="agentPlanBtn" type="button">Agent 智能规划（LLM + Google Maps）</button>
      <div id="planProgressWrap" class="plan-progress hidden">
        <div class="plan-progress-head">
          <span id="planProgressStage">等待开始</span>
          <span id="planProgressPercent">0%</span>
        </div>
        <div class="plan-progress-track">
          <div id="planProgressFill" class="plan-progress-fill"></div>
        </div>
      </div>
    </section>

    <section class="panel map-panel">
      <h2>Google 地图标点展示</h2>
      <div id="routeModeToggle" class="route-mode-toggle hidden">
        <button id="routeModeDrivingBtn" type="button" class="route-mode-btn active" data-mode="driving">自驾路线</button>
        <button id="routeModeTransitBtn" type="button" class="route-mode-btn" data-mode="transit">公交路线</button>
      </div>
      <div id="map" class="map"></div>
      <p class="tips">无 LLM 时仅按输入顺序标点（1、2、3…）；智能规划后展示完整路线，可切换自驾/公交视图。</p>
    </section>

    <section class="panel itinerary">
      <h2>智能路书</h2>
      <button id="downloadRoadbookBtn" type="button" class="btn-secondary btn-inline hidden">导出路书 TXT</button>
      <div id="itineraryResult" class="itinerary-result">
        <p class="itinerary-placeholder">填写 LLM 配置并点击「Agent 智能规划」后，路书将显示在这里。</p>
      </div>
    </section>
  </main>

  <script src="./location-data.js"></script>
  <script src="./planner.js"></script>
  <script src="./llm.js"></script>
  <script src="./app.js"></script>
</body>
</html>
